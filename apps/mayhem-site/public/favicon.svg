<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- The Mayhem app's icon and its sidebar logo (one artwork): an augment offer – three augment
       cards fanned out, silver left, prismatic right, gold in front with the "m" in its round
       symbol (rarity colours from MAYHEM-DESIGN.md: silver #c9d1d9, gold #f2c14e, prisma #6fd6ff,
       cards #191c25, symbol #13151c). Transparent around the cards, no tile and no gold border
       (user choice 10.10.2026, "Angebot · Eng & groß"). Own drawing; the letter is paths, so no
       font is needed. mayhem.ico is made from this file (VALIDATION.md). -->
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d1d9" stop-opacity=".38"/><stop offset=".55" stop-color="#191c25"/></linearGradient>
    <linearGradient id="prisma" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd6ff" stop-opacity=".38"/><stop offset=".55" stop-color="#191c25"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2c14e" stop-opacity=".38"/><stop offset=".55" stop-color="#191c25"/></linearGradient>
  </defs>
  <g transform="translate(128 132) scale(1.14) translate(-128 -128)">
    <g transform="rotate(-11 128 236)">
      <rect x="76" y="40" width="104" height="156" rx="18" fill="#191c25"/>
      <rect x="76" y="40" width="104" height="156" rx="18" fill="url(#silver)"/>
      <circle cx="128" cy="98" r="32" fill="#13151c"/><circle cx="128" cy="98" r="32" fill="#c9d1d9" opacity=".18"/>
      <rect x="98" y="148" width="60" height="9" rx="4.5" fill="#3a3f4f"/><rect x="108" y="166" width="40" height="9" rx="4.5" fill="#3a3f4f"/>
    </g>
    <g transform="rotate(11 128 236)">
      <rect x="76" y="40" width="104" height="156" rx="18" fill="#191c25"/>
      <rect x="76" y="40" width="104" height="156" rx="18" fill="url(#prisma)"/>
      <circle cx="128" cy="98" r="32" fill="#13151c"/><circle cx="128" cy="98" r="32" fill="#6fd6ff" opacity=".18"/>
      <rect x="98" y="148" width="60" height="9" rx="4.5" fill="#3a3f4f"/><rect x="108" y="166" width="40" height="9" rx="4.5" fill="#3a3f4f"/>
    </g>
    <g transform="translate(0 -8)">
      <rect x="76" y="40" width="104" height="156" rx="18" fill="#191c25"/>
      <rect x="76" y="40" width="104" height="156" rx="18" fill="url(#gold)"/>
      <circle cx="128" cy="98" r="32" fill="#13151c"/><circle cx="128" cy="98" r="32" fill="#f2c14e" opacity=".18"/>
      <path fill="#f2c14e" transform="translate(128 98) scale(.3404) translate(-128 -128)" d="M53 80H83V176H53Z M113 125H143V176H113Z M173 125H203V176H173Z M53 125A45 45 0 0 1 143 125H113A15 15 0 0 0 83 125Z M113 125A45 45 0 0 1 203 125H173A15 15 0 0 0 143 125Z"/>
      <rect x="98" y="148" width="60" height="9" rx="4.5" fill="#3a3f4f"/><rect x="108" y="166" width="40" height="9" rx="4.5" fill="#3a3f4f"/>
    </g>
  </g>
</svg>
