<!doctype html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>blank. Collector</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><b>blank.</b><span>Mayhem Collector</span></header>
<section><h1>Insgesamt gesammelt</h1><div class="numbers"><div><strong id="total-matches">–</strong><span>Matches</span></div><div><strong id="total-players">–</strong><span>Spieler</span></div></div></section>

<label><input id="autostart" type="checkbox" checked> Mit Windows starten</label>
<p class="note">Sammelt automatisch deine Mayhem-Matchdaten für das gemeinsame Archiv. Schließen minimiert in den Infobereich.</p>
</main><script src="app.js"></script></body></html>
