name: Release

# Builds the Mayhem app on Windows for every version tag (v0.1.0, v0.2.0, …) and attaches it to a
# GitHub release, as mayhem.exe and – the same file – as blank.exe: blank. is paused and becomes the
# Mayhem app through its own update (user's decision 08.10.2026; from_blank.rs cleans up after it).
# blank. itself is still built as a check, but not shipped. The tag must match the version in
# package.json. A manual run (Actions tab) only builds and keeps the files as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      # Release EXEs only via the Tauri CLI (custom-protocol), never plain cargo build --release.
      # blank. (paused) is built only as a check and not shipped. Its Twitch client ID (a repository
      # variable, no secret: twitch/mod.rs) stays here for when blank. ships again.
      - run: pnpm desktop:build
        env:
          BLANK_TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
      # The Mayhem app (mayhem.rs, its own config): src-tauri/target/release/mayhem.exe.
      - run: pnpm mayhem:build
      # The browser extension for watching together, as a zip to unpack and load.
      - run: pnpm extension:build

      # Always the same file names, so the README links .../releases/latest/download/mayhem.exe and
      # blank-extension.zip work, and so do the updaters (update.rs, each with GitHub's SHA-256
      # digest): blank. takes only blank.exe – here the Mayhem app, which takes its place –, the
      # Mayhem app takes mayhem.exe, also when it runs as blank.exe.
      - name: Collect the download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force download | Out-Null
          Copy-Item src-tauri/target/release/mayhem.exe download/mayhem.exe
          Copy-Item src-tauri/target/release/mayhem.exe download/blank.exe
          Compress-Archive -Path extension/dist/* -DestinationPath download/blank-extension.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Mayhem ${{ github.ref_name }}
          files: |
            download/mayhem.exe
            download/blank.exe
            download/blank-extension.zip
          body_path: .github/release-notes.md

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: mayhem-windows-x64
          path: |
            download/mayhem.exe
            download/blank.exe
            download/blank-extension.zip
