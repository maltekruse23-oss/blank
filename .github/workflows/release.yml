name: Release

# Builds blank.exe on Windows for every version tag (v0.1.0, v0.2.0, …) and attaches it to a
# GitHub release. The tag must match the version in package.json. A manual run (Actions tab)
# only builds and keeps the EXE as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      # Release EXE only via the Tauri CLI (custom-protocol), never plain cargo build --release.
      # The app's own Twitch client ID (a repository variable, no secret: twitch/mod.rs), so friends
      # only sign in; without the variable everyone enters their own, as before.
      - run: pnpm desktop:build
        env:
          BLANK_TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
      # blank.exe aside before the Mayhem app is built from the same crate (same target folder).
      - name: Keep blank.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force download | Out-Null
          Copy-Item src-tauri/target/release/blank.exe download/blank.exe
      # The Mayhem app (mayhem.rs, its own config): src-tauri/target/release/mayhem.exe.
      - run: pnpm mayhem:build
      # The browser extension for watching together, as a zip to unpack and load.
      - run: pnpm extension:build

      # Always the same file names, so the README links .../releases/latest/download/blank.exe,
      # mayhem.exe and blank-extension.zip work (the updater only takes blank.exe).
      - name: Collect the download
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/mayhem.exe download/mayhem.exe
          Compress-Archive -Path extension/dist/* -DestinationPath download/blank-extension.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: blank. ${{ github.ref_name }}
          files: |
            download/blank.exe
            download/mayhem.exe
            download/blank-extension.zip
          body_path: .github/release-notes.md

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: blank-windows-x64
          path: |
            download/blank.exe
            download/mayhem.exe
            download/blank-extension.zip
